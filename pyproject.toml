[project]
name = "meeting-transcriber"
version = "0.2.0"
description = "Transcription locale de réunions audio, avec identification des locuteurs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Terry Henrard" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "whisperx>=3.8",
    "torch",
    "torchaudio",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/TerryHenrard/meeting-transcriber"

[project.scripts]
transcribe = "meeting_transcriber.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_transcriber"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Builds CUDA sur Windows et Linux. Ils tournent aussi sans GPU NVIDIA.
# L'index CUDA n'a pas de wheels macOS : on y prend le torch standard de PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration test requiring GPU and downloaded models"]
